<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects - Software Usability Testing Recorder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="navbar-container"></div>

  <div class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">Projects Management</h1>
        <p class="page-subtitle">Add and track target applications under usability evaluation</p>
      </div>
    </div>

    <div id="alert-container"></div>

    <!-- Add Project Form (Admin Only) -->
    <div class="card" id="add-project-card" style="display: none;">
      <div class="card-title">➕ Add New Project</div>
      <form id="projectForm" onsubmit="handleCreateProject(event)">
        <div class="form-group">
          <label for="projectName">Project Name *</label>
          <input type="text" id="projectName" placeholder="e.g. Mobile Banking App V2" required>
        </div>
        <div class="form-group">
          <label for="projectDesc">Project Description</label>
          <textarea id="projectDesc" placeholder="Brief description of the software project, targets, or testing scope..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Create Project</button>
      </form>
    </div>

    <!-- Projects List Table -->
    <div class="card">
      <div class="card-title">📁 Existing Projects</div>
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Project Name</th>
              <th>Description</th>
              <th>Created Date</th>
              <th id="actions-col" style="display: none; text-align: right;">Actions</th>
            </tr>
          </thead>
          <tbody id="projects-table">
            <tr>
              <td colspan="5" class="empty-state">Loading projects...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <footer>
    Software Usability Testing Recorder &copy; 2026 - Usability Engineering Portal
  </footer>

  <script src="script.js"></script>
  <script>
    const user = checkAuth();
    renderNavbar();

    const isAdmin = user && user.role === 'admin';
    if (isAdmin) {
      document.getElementById('add-project-card').style.display = 'block';
      document.getElementById('actions-col').style.display = 'table-cell';
    }

    async function loadProjects() {
      try {
        const res = await fetch('/api/projects');
        const projects = await res.json();
        const tbody = document.getElementById('projects-table');

        if (projects.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No projects added yet.</td></tr>';
          return;
        }

        tbody.innerHTML = projects.map(p => `
          <tr>
            <td>#${p.id}</td>
            <td><strong>${p.name}</strong></td>
            <td>${p.description || '<em style="color: var(--text-muted);">No description</em>'}</td>
            <td>${formatDate(p.created_at)}</td>
            ${isAdmin ? `
              <td style="text-align: right;">
                <button onclick="deleteProject(${p.id}, '${p.name.replace(/'/g, "\\'")}')" class="btn btn-danger btn-sm">Delete</button>
              </td>
            ` : ''}
          </tr>
        `).join('');

      } catch (err) {
        console.error('Failed to load projects:', err);
        showAlert('Failed to load projects list.');
      }
    }

    async function handleCreateProject(e) {
      e.preventDefault();
      const name = document.getElementById('projectName').value;
      const description = document.getElementById('projectDesc').value;

      try {
        const res = await fetch('/api/projects', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, description })
        });

        const data = await res.json();
        if (res.ok) {
          showAlert('Project created successfully!', 'success');
          document.getElementById('projectForm').reset();
          loadProjects();
        } else {
          showAlert(data.error || 'Failed to create project.');
        }
      } catch (err) {
        showAlert('Server error while creating project.');
      }
    }

    async function deleteProject(id, name) {
      if (!confirm(`Are you sure you want to delete project "${name}"? All associated scenarios and issues will be removed.`)) {
        return;
      }

      try {
        const res = await fetch(`/api/projects/${id}`, { method: 'DELETE' });
        if (res.ok) {
          showAlert('Project deleted successfully.', 'success');
          loadProjects();
        } else {
          const data = await res.json();
          showAlert(data.error || 'Failed to delete project.');
        }
      } catch (err) {
        showAlert('Server error deleting project.');
      }
    }

    if (user) {
      loadProjects();
    }
  </script>
</body>
</html>
